<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>感謝祭クイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@500;700;800&display=swap">
<style>
:root{
  --bg:#0A0E27; --bg2:#10173C; --panel:#151D4D; --panel2:#1C2763; --line:#2C3984;
  --text:#F3F5FF; --muted:#A5ADDC; --gold:#FFC933; --gold-ink:#241800;
  --out:#FF5B6B; --ok:#3BDB98;
  --c1:#E5445C; --c2:#2F7BEF; --c3:#1DA866; --c4:#EFA300;
  --disp:"Dela Gothic One","Hiragino Kaku Gothic StdN","Hiragino Sans","Noto Sans JP",sans-serif;
  --body:"M PLUS 1p","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic","Meiryo",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(120% 70% at 50% -20%,#24307E 0%,rgba(36,48,126,0) 60%),var(--bg);
  color:var(--text);font-family:var(--body);font-weight:700;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{height:100%}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- shared ---------- */
.btn{font-weight:800;border-radius:12px;padding:10px 18px;border:2px solid var(--line);background:var(--panel);cursor:pointer;line-height:1.3}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-size:18px;padding:12px 28px;box-shadow:0 4px 0 #9A7400}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 #9A7400}
.btn.primary:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent}
.telop{font-family:var(--disp);font-weight:400;color:var(--gold);letter-spacing:.02em;
  text-shadow:0 .06em 0 #6B4A00,0 0 .6em rgba(255,201,51,.35);text-wrap:balance}
.eyebrow{color:var(--muted);letter-spacing:.12em;font-size:clamp(14px,1.4vw,20px)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--out);display:inline-block;box-shadow:0 0 0 3px rgba(255,91,107,.2)}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(59,219,152,.2)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000C;border:1px solid var(--line);
  padding:10px 18px;border-radius:12px;z-index:80;max-width:calc(100% - 32px);text-align:center}
.modal{position:fixed;inset:0;background:rgba(4,6,20,.78);display:grid;place-items:center;padding:16px;z-index:60}
.sheet{background:var(--bg2);border:1px solid var(--line);border-radius:16px;width:min(920px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-size:20px}
.sheet p{margin:0;color:var(--muted);font-weight:500}
.sheet textarea{width:100%;min-height:46vh;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:500 15px/1.7 var(--body);resize:vertical}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.errs{color:var(--out);font-weight:700;margin:0;padding-left:1.2em}
.field{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.field input[type=number]{width:90px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:700 18px var(--body);text-align:center}
.field input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold)}
.field small{display:block;color:var(--muted);font-weight:500}
.fmt{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font:500 14px/1.7 var(--body);color:var(--muted);overflow-x:auto;white-space:pre}

/* ---------- landing ---------- */
.landing{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding-block:32px;padding-inline:16px}
.landing .telop{font-size:clamp(40px,8vw,88px);text-align:center;line-height:1.1}
.landing .lead{color:var(--muted);text-align:center;font-weight:500;margin:0}
.doors{display:grid;grid-template-columns:repeat(2,minmax(0,340px));gap:20px;width:100%;justify-content:center}
.door{background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px}
.door h2{margin:0;font-size:22px}
.door p{margin:0;color:var(--muted);font-weight:500;font-size:14px}
.door input{width:100%;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:12px;color:var(--text);font:400 26px var(--disp);letter-spacing:.2em;text-transform:uppercase;text-align:center}
.door .btn{width:100%}
.resume{font-size:14px}
@media (max-width:720px){.doors{grid-template-columns:minmax(0,1fr)}}

/* ---------- host ---------- */
.host{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px clamp(16px,2.4vw,40px);border-bottom:1px solid var(--line);background:rgba(10,14,39,.55)}
.brand{font-family:var(--disp);color:var(--gold);font-size:18px;white-space:nowrap}
.tb-mid{font-size:clamp(15px,1.6vw,22px);text-align:center}
.tb-mid .qc{color:var(--muted)}
.tb-right{display:flex;align-items:center;gap:14px;white-space:nowrap}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:clamp(14px,1.4vw,20px)}
.pill b{font-family:var(--disp);font-weight:400;color:var(--gold);font-size:1.25em;margin:0 .1em}
.roomtag{color:var(--muted);font-size:14px;letter-spacing:.08em}
.stage{padding:clamp(16px,2.4vw,40px);overflow:auto;display:flex;flex-direction:column;min-height:0}
.ctrl{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px clamp(16px,2.4vw,40px) calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:rgba(10,14,39,.55)}
.ctrl-left,.ctrl-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint{color:var(--muted);font-size:13px;font-weight:500}

/* lobby */
.lobby{display:grid;grid-template-columns:minmax(260px,400px) minmax(0,1fr);gap:clamp(20px,3vw,48px);align-items:start}
.joinbox{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.qrwrap{background:#fff;border-radius:18px;padding:14px;box-shadow:0 0 0 6px rgba(255,201,51,.25)}
.qrwrap canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.join-steps{text-align:center;font-size:clamp(16px,1.6vw,22px)}
.codebox{display:flex;align-items:baseline;justify-content:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.codebox .lbl{color:var(--muted);font-size:14px}
.codebox .code{font-family:var(--disp);font-size:clamp(30px,3.4vw,48px);letter-spacing:.18em;color:var(--gold)}
.url{color:var(--muted);font-size:13px;font-weight:500;word-break:break-all;text-align:center}
.warn{background:rgba(255,91,107,.12);border:1px solid var(--out);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:500}
.entrants{display:flex;flex-direction:column;gap:16px;min-width:0}
.ent-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.ent-head h2{margin:0;font-family:var(--disp);font-weight:400;font-size:clamp(26px,3vw,44px)}
.count{font-size:clamp(18px,1.8vw,24px)}
.count b{font-family:var(--disp);font-weight:400;font-size:2.4em;color:var(--gold);margin-right:.1em}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;min-height:120px;background:rgba(21,29,77,.5);border:1px dashed var(--line);border-radius:14px;padding:14px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:clamp(14px,1.4vw,19px);animation:pop .35s ease-out}
.chip.bot{color:var(--muted);border-style:dashed}
.chips .empty{color:var(--muted);font-weight:500;align-self:center;margin:auto}
.lobby-tools{display:flex;gap:10px;flex-wrap:wrap}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

/* center stage */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2vh,24px);text-align:center}
.center .telop.huge{font-size:clamp(48px,9vw,150px);line-height:1.05}
.center .sub{font-size:clamp(18px,2vw,30px)}
.rules{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.rules span{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 16px;font-size:clamp(14px,1.4vw,20px)}
.champ-name{font-family:var(--disp);font-size:clamp(44px,8vw,130px);line-height:1.1;text-wrap:balance;word-break:break-word;
  background:linear-gradient(180deg,#FFF3C4,#FFC933 55%,#E09A00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .05em 0 #6B4A00)}

/* question */
.qwrap{flex:1;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:clamp(10px,1.6vh,20px);min-height:0}
.qcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:clamp(12px,2vw,28px);align-items:center;
  background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:18px;padding:clamp(14px,2vw,30px)}
.qno{font-family:var(--disp);color:var(--gold);font-size:clamp(34px,4.4vw,72px);line-height:1}
.qno span{font-size:.55em;margin-right:.08em}
.qtext{font-size:clamp(22px,3.3vw,54px);font-weight:800;line-height:1.35;text-wrap:balance}
.timer{width:clamp(72px,8vw,130px);aspect-ratio:1;position:relative;max-width:100%}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .trk{fill:none;stroke:var(--line);stroke-width:9}
.timer .arc{fill:none;stroke:var(--gold);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .1s linear}
.timer.hurry .arc{stroke:var(--out)}
.timer .tn{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-size:clamp(26px,3.2vw,52px)}
.banner{justify-self:center;font-family:var(--disp);font-size:clamp(20px,2.4vw,38px);color:var(--gold);letter-spacing:.06em;min-height:1.3em}
.banner.alarm{color:var(--out)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:clamp(10px,1.4vw,20px);min-height:0}
.choices.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.ch{position:relative;display:flex;align-items:center;gap:clamp(12px,1.6vw,22px);border-radius:16px;background:var(--panel);border:2px solid var(--line);
  padding:clamp(10px,1.4vw,22px);overflow:hidden;min-height:clamp(70px,13vh,170px);transition:opacity .4s,filter .4s,transform .4s}
.ch .num{position:relative;z-index:1;flex:none;width:clamp(48px,5.4vw,88px);aspect-ratio:1;border-radius:14px;display:grid;place-items:center;font-family:var(--disp);font-size:clamp(28px,3.4vw,56px);color:#fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25)}
.ch .ctext{position:relative;z-index:1;flex:1;min-width:0;font-size:clamp(20px,2.7vw,46px);font-weight:800;line-height:1.3;text-wrap:balance;word-break:break-word;transition:opacity .35s}
.ch .cnt{position:relative;z-index:1;font-family:var(--disp);font-size:clamp(26px,3.4vw,58px);min-width:1.6em;text-align:right}
.ch .cnt small{font-family:var(--body);font-size:.4em;margin-left:.15em}
.ch .bar{position:absolute;left:0;top:0;bottom:0;width:0;opacity:.32;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.k1 .num,.k1 .bar{background:var(--c1)} .k2 .num,.k2 .bar{background:var(--c2)}
.k3 .num,.k3 .bar{background:var(--c3)} .k4 .num,.k4 .bar{background:var(--c4)}
.ch.hid .ctext{opacity:0}
.ch.correct{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold),0 0 48px rgba(255,201,51,.55);animation:glow 1.2s ease-in-out infinite alternate}
.reveal .ch:not(.correct){opacity:.3;filter:saturate(.3)}
@keyframes glow{to{box-shadow:0 0 0 4px var(--gold),0 0 80px rgba(255,201,51,.8)}}
.answered{justify-self:end;color:var(--muted);font-size:clamp(14px,1.5vw,22px)}
.answered b{color:var(--text);font-family:var(--disp);font-weight:400;font-size:1.3em}

/* results */
.results{flex:1;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(14px,2vw,28px);min-height:0}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:18px;padding:clamp(14px,1.8vw,26px);display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.panel h2{margin:0;font-family:var(--disp);font-weight:400;font-size:clamp(22px,2.4vw,38px);color:var(--gold)}
.ranks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ranks li{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto auto;align-items:center;gap:12px;background:rgba(10,14,39,.45);border-radius:10px;padding:6px 14px;font-size:clamp(16px,1.9vw,30px);animation:slide .4s ease-out backwards}
.ranks li .rk{font-family:var(--disp);color:var(--gold)}
.ranks li:first-child{background:rgba(255,201,51,.16);outline:2px solid rgba(255,201,51,.5)}
.ranks li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ranks li .tm{color:var(--muted)}
.ranks li.slow{background:rgba(255,91,107,.16);outline:2px solid var(--out)}
.ranks li.slow .rk{color:var(--out)}
.tag{background:var(--out);color:#fff;border-radius:6px;padding:1px 8px;font-size:.6em}
.tag.gold{background:var(--gold);color:var(--gold-ink)}
@keyframes slide{from{transform:translateX(-24px);opacity:0}to{transform:none;opacity:1}}
.more{color:var(--muted);font-weight:500}
.outgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.o-item{background:rgba(10,14,39,.45);border-radius:12px;padding:10px;text-align:center;display:flex;flex-direction:column}
.o-item b{font-family:var(--disp);font-weight:400;font-size:clamp(30px,3.6vw,60px);color:var(--out);line-height:1.1}
.o-item span{color:var(--muted);font-size:clamp(13px,1.3vw,18px)}
.slownames{font-size:clamp(15px,1.6vw,24px)}
.remain{margin-top:auto;text-align:center;font-size:clamp(20px,2.4vw,36px)}
.remain b{font-family:var(--disp);font-weight:400;color:var(--gold);font-size:1.8em;margin:0 .1em}
.nocount{font-family:var(--disp);font-size:clamp(28px,3.4vw,56px);color:var(--gold);text-align:center;line-height:1.3}
.final{flex:1;display:flex;flex-direction:column;gap:clamp(14px,2vh,26px);min-height:0}
.final>.telop{font-size:clamp(36px,5vw,80px);text-align:center}
.final-grid{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,2vw,28px);min-height:0}
@media (max-width:820px){
  .lobby,.results,.final-grid{grid-template-columns:minmax(0,1fr)}
  .qcard{grid-template-columns:auto minmax(0,1fr)}
  .qcard .timer{grid-column:1/-1;justify-self:center}
  .choices,.choices.n3{grid-template-columns:minmax(0,1fr)}
  .tb-right .roomtag,.hint{display:none}
}

/* ---------- player (phone) ---------- */
.pl{min-height:100%;display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto;
  padding-block:12px calc(16px + env(safe-area-inset-bottom,0px));padding-inline:16px}
.pl-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.pl-top .me{color:var(--text);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-top .right{display:flex;align-items:center;gap:8px;white-space:nowrap}
.status{background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-height:112px;justify-content:center}
.status .s-eyebrow{color:var(--muted);font-size:13px}
.status .s-main{font-size:22px;font-weight:800;line-height:1.35}
.status .s-main.big{font-family:var(--disp);font-weight:400;font-size:min(26px,6.6vw);text-wrap:balance}
.status .s-sub{color:var(--muted);font-weight:500;font-size:14px}
.status.good{border-color:var(--ok)} .status.good .s-main{color:var(--ok)}
.status.bad{border-color:var(--out)} .status.bad .s-main{color:var(--out)}
.status.gold{border-color:var(--gold);box-shadow:0 0 30px rgba(255,201,51,.35)} .status.gold .s-main{color:var(--gold)}
.pq{font-size:17px;font-weight:700;line-height:1.5}
.tbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--gold);width:100%;transform-origin:left}
.pads{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:300px}
.pads.n3 .pad:last-child{grid-column:1/-1}
.pad{border:0;border-radius:20px;color:#fff;font-family:var(--disp);font-size:60px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 7px 0 rgba(0,0,0,.4);touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;padding:10px;user-select:none;-webkit-user-select:none}
.pad:active:not(:disabled){transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.pad small{font-family:var(--body);font-size:15px;font-weight:800;line-height:1.3;text-align:center;word-break:break-word}
.pad.k1{background:var(--c1)} .pad.k2{background:var(--c2)} .pad.k3{background:var(--c3)} .pad.k4{background:var(--c4)}
.pad.sel{outline:6px solid #fff;outline-offset:-6px}
.pads.has-sel .pad:not(.sel){opacity:.5}
.pad:disabled{opacity:.22;cursor:default;box-shadow:none}
.pads.has-sel .pad.sel:disabled{opacity:1}
.pads.correct-shown .pad.ans{opacity:1;outline:6px solid var(--gold);outline-offset:-6px}
.join{display:flex;flex-direction:column;gap:14px;margin-top:10vh}
.join label{font-size:15px;color:var(--muted)}
.join input{width:100%;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:14px;color:var(--text);font:800 22px var(--body)}
.pl .telop{font-size:40px;text-align:center}
.champlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.champlist li{display:flex;justify-content:space-between;gap:10px;background:rgba(10,14,39,.45);border-radius:10px;padding:8px 12px}
.champlist li span{color:var(--muted);font-weight:500}

canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

mods["QR8bitByte"]=function(module,exports,require){

function QRBitBuffer() {

    const T = (f, d, ty, v, w) => this.tone(f, d, ty, v, w);
    switch (n) {
      case "join": T(880, .12, "sine", .06); T(1320, .14, "sine", .05, .07); break;
      case "period": [523, 659, 784, 1047].forEach((f, i) => T(f, .22, "square", .06, i * .11)); break;
      case "question": T(1568, .1, "square", .05); T(2093, .3, "square", .05, .1); break;
      case "open": T(1175, .15, "triangle", .08); T(1568, .2, "triangle", .08, .08); break;
      case "tick": T(1046, .08, "square", .05); break;
      case "buzzer": T(196, .6, "sawtooth", .07); T(147, .6, "sawtooth", .05); break;
      case "drum": for (let i = 0; i < 16; i++) this.noise(.07, .05, i * .06); break;
      case "chime": [784, 988, 1175, 1568].forEach((f, i) => T(f, .4, "triangle", .1, i * .09)); break;
      case "out": [392, 330, 262].forEach((f, i) => T(f, .24, "square", .05, i * .15)); break;
      case "fanfare": [[523, 0], [523, .14], [523, .28], [659, .42], [784, .72], [659, .96], [784, 1.1], [1047, 1.3]].forEach(([f, w]) => T(f, .32, "square", .06, w)); break;
    }
  },
};

/* =========================================================
   紙吹雪
   ========================================================= */
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let cv = $("#confetti"); if (!cv) { cv = document.createElement("canvas"); cv.id = "confetti"; document.body.appendChild(cv); }
  const ctx = cv.getContext("2d"); const W = cv.width = innerWidth * devicePixelRatio, H = cv.height = innerHeight * devicePixelRatio;
  const cols = ["#E5445C", "#2F7BEF", "#1DA866", "#EFA300", "#FFC933", "#FFFFFF"];
  const ps = Array.from({ length: 180 }, () => ({ x: Math.random() * W, y: -Math.random() * H * .6, vx: (Math.random() - .5) * 4, vy: 2 + Math.random() * 4,
    s: (6 + Math.random() * 8) * devicePixelRatio, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[Math.floor(Math.random() * cols.length)] }));
  const t0 = now();
  (function frame() {
    const t = now() - t0; ctx.clearRect(0, 0, W, H);
    for (const p of ps) { p.x += p.vx; p.y += p.vy; p.vy += .05; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); }
    if (t < 5000) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
  })();
}

/* =========================================================
   問題の読み込み
   ========================================================= */
function parseQuiz(text) {
  const periods = [], errors = []; let cur = null;
  String(text).split(/\r?\n/).forEach((raw, i) => {
    const line = raw.trim(); if (!line) return;
    if (/^[#＃]/.test(line)) { cur = { title: line.replace(/^[#＃]+/, "").trim() || `第${periods.length + 1}ピリオド`, qs: [] }; periods.push(cur); return; }
    const f = line.split(/\s*[|｜]\s*/);
    if (f.length < 4) { errors.push(`${i + 1}行目：「問題 | 選択肢 | 選択肢 | 正解の番号」の形になっていません`); return; }
    const a = parseInt(f.pop().replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0) - 0xFEE0)), 10);
    const t = f.shift(); const c = f.filter(Boolean);
    if (!t) { errors.push(`${i + 1}行目：問題文がありません`); return; }
    if (c.length < 2 || c.length > 4) { errors.push(`${i + 1}行目：選択肢は2〜4個にしてください`); return; }
    if (!(a >= 1 && a <= c.length)) { errors.push(`${i + 1}行目：正解の番号は1〜${c.length}で書いてください`); return; }
    if (!cur) { cur = { title: "第1ピリオド", qs: [] }; periods.push(cur); }
    cur.qs.push({ t, c, a: a - 1 });
  });
  return { periods: periods.filter(p => p.qs.length), errors };
}

/* =========================================================
   司会（ホスト）
   ========================================================= */
const H = {
  link: null, mode: "mqtt", brokerIdx: 0, custom: null, code: "", connected: false,
  players: new Map(), periods: [], settings: { ...DEFAULT_SETTINGS }, quizText: DEFAULT_QUIZ,
  pi: 0, qi: -1, periodActive: false, phase: "connecting", qid: "", answers: new Map(), qStart: 0,
  limitEnd: 0, acceptUntil: 0, timers: [], botTimers: [], tick: null, lastTickSec: null,
  result: null, champ: null, history: [], periodTime: new Map(),
};
const T = s => TOPIC_ROOT + H.code + "/" + s;

async function startHost(snap) {
  H.settings = { ...DEFAULT_SETTINGS, ...store.get("kq-settings", {}) };
  H.quizText = store.get("kq-quiz", DEFAULT_QUIZ);
  H.periods = parseQuiz(H.quizText).periods;
  if (!H.periods.length) { H.quizText = DEFAULT_QUIZ; H.periods = parseQuiz(DEFAULT_QUIZ).periods; }
  app.innerHTML = `<div class="landing"><div class="telop" style="font-size:40px">接続中…</div><p class="lead" id="connMsg">中継サーバーを探しています</p></div>`;

  let link = null;

  else if (params.get("mq") && /^wss?:\/\//.test(params.get("mq"))) {

  } else {

    for (const i of order) {

      const c = new MiniMQTT(BROKERS[i].url);

    }
  }
  if (!link) {
    app.innerHTML = `
    <div class="landing">
      <div class="telop" style="font-size:40px">つながりませんでした</div>
      <p class="lead">インターネットにつながっているか確認してね。学校のWi-Fiでだめなときは、スマホのテザリングで試すと直ることがあります。</p>
      <div class="doors" style="grid-template-columns:minmax(0,340px) minmax(0,340px)">
        <button class="btn primary" id="bRetry">もう一度ためす</button>

      </div>
    </div>`;
    $("#bRetry").onclick = () => startHost(snap);
    $("#bOffline").onclick = async () => { H.link = new NullLink(); H.mode = "offline"; await H.link.connect(); hostReady(snap); };
    return;
  }
  H.link = link;
  hostReady(snap);
}

function hostReady(snap) {
  const link = H.link;
  if (snap) {
    H.code = snap.code; H.pi = snap.pi; H.qi = snap.qi; H.periodActive = snap.periodActive; H.history = snap.history || [];
    H.periodTime = new Map(snap.periodTime || []);
    for (const p of snap.players || []) H.players.set(p.id, { ...p, res: null });
    H.resumed = true;
  } else {
    H.code = H.mode === "mqtt" ? makeCode(H.brokerIdx) : rand(5, CODE_CHARS);
  }
  if (H.mode === "mqtt" && brokerForCode(H.code) !== H.brokerIdx) H.code = makeCode(H.brokerIdx);
  link.on("status", ok => { H.connected = ok; renderTop(); if (ok) publishState(); });
  link.on("message", onHostMessage);
  link.subscribe(T("join")); link.subscribe(T("ans"));
  H.connected = link.connected;
  window.addEventListener("beforeunload", e => { if (H.periodActive) { e.preventDefault(); e.returnValue = ""; } });
  document.addEventListener("keydown", e => {
    if ($(".modal")) return;
    if (e.target.closest && e.target.closest("input,textarea,select,button,a")) return;
    if (e.key === " " || e.key === "Enter" || e.key === "ArrowRight") { e.preventDefault(); next(); }
  });
  hostShell();
  setPhase("lobby");
}

function joinUrl() {
  const u = new URL(location.href); u.search = ""; u.hash = "";
  u.searchParams.set("room", H.code);
  if (H.mode === "local") u.searchParams.set("local", "1");
  if (H.mode === "custom") u.searchParams.set("mq", H.custom);
  return u.toString();
}

/* ----- メッセージ受信 ----- */
let joinPubTimer = null;
function onHostMessage(topic, str) {
  let m; try { m = JSON.parse(str); } catch (e) { return; }
  if (!m || typeof m !== "object") return;
  if (topic === T("join")) handleJoin(m);
  else if (topic === T("ans")) handleAns(m);
}
function handleJoin(m) {
  const id = cleanId(m.id), name = cleanName(m.n); if (!id || !name) return;
  let p = H.players.get(id);
  if (!p) {
    p = { id, name, bot: false, alive: !H.periodActive, waiting: H.periodActive, correct: 0, champs: 0, res: null };
    H.players.set(id, p); SFX.play("join"); saveSnap();
  } else if (p.name !== name) { p.name = name; saveSnap(); }
  if (H.phase === "lobby") renderLobbyList();
  renderTop();
  clearTimeout(joinPubTimer); joinPubTimer = setTimeout(publishState, 200);
}
function handleAns(m) {
  if (m.q !== H.qid) return;
  if (!["read", "open", "closing"].includes(H.phase)) return;
  if (H.phase === "closing" && now() > H.acceptUntil) return;
  const p = H.players.get(cleanId(m.id)); if (!p || !p.alive) return;
  const q = curQ(); const c = Number(m.c);
  if (!Number.isInteger(c) || c < 0 || c >= q.c.length) return;
  const ms = Math.max(0, Math.min(600000, Math.round(Number(m.ms) || 0)));
  H.answers.set(p.id, { c, ms });
  updateAnswered();
}
function aliveList() { return [...H.players.values()].filter(p => p.alive); }
function updateAnswered() {
  const alive = aliveList(); const n = alive.filter(p => H.answers.has(p.id)).length;
  const el = $("#answered"); if (el) el.innerHTML = `回答 <b class="tnum">${n}</b> / ${alive.length}人`;
  if (H.phase === "open" && alive.length && n === alive.length) H.limitEnd = Math.min(H.limitEnd, now() + 1200);
}

/* ----- 進行 ----- */
const curPeriod = () => H.periods[H.pi];
const curQ = () => { const p = curPeriod(); return p && p.qs[H.qi]; };
function later(ms, fn) { H.timers.push(setTimeout(fn, ms)); }
function clearTimers() { H.timers.forEach(clearTimeout); H.timers = []; clearInterval(H.tick); H.tick = null; }

function next() {
  SFX.init();
  switch (H.phase) {
    case "lobby":
      if (!H.players.size) { toast("まだ参加者がいません。QRコードで参加してもらってね"); return; }
      if (H.periodActive) nextQuestion(); else startPeriod();
      break;
    case "period": nextQuestion(); break;
    case "read": openChoices(); break;
    case "open": closeAnswers(); break;
    case "check": doReveal(); break;
    case "reveal": doResult(); break;
    case "result":
      if (H.result.champion) announceChampion(H.result.champion, false);
      else nextQuestion();
      break;
    case "champion": H.pi++; startPeriod(); break;
  }
}
function startPeriod() {
  clearTimers();
  if (H.pi >= H.periods.length) { setPhase("final"); saveSnap(); return; }
  H.periodActive = true; H.qi = -1; H.periodTime = new Map(); H.champ = null; H.result = null;
  for (const p of H.players.values()) { p.alive = true; p.waiting = false; p.res = null; }
  saveSnap(); setPhase("period"); SFX.play("period");
}
function nextQuestion() {
  clearTimers();
  const per = curPeriod();
  if (H.qi + 1 >= per.qs.length) { decideByTime(); return; }
  H.qi++; H.qid = rand(8); H.answers = new Map(); H.result = null; H.lastTickSec = null;
  for (const p of H.players.values()) p.res = null;
  H.qStart = now();
  setPhase("read"); SFX.play("question");
  scheduleBots();
  later(H.settings.readDelay * 1000, openChoices);
}
function openChoices() {
  if (H.phase !== "read") return;
  clearTimers();
  H.limitEnd = now() + H.settings.limit * 1000;
  setPhase("open"); SFX.play("open");
  H.tick = setInterval(tickCountdown, 100); tickCountdown();
}
function tickCountdown() {
  const left = Math.max(0, H.limitEnd - now());
  const s = Math.ceil(left / 1000);
  drawTimer(left / (H.settings.limit * 1000), s, s <= 3);
  if (s !== H.lastTickSec) { if (s <= 3 && s > 0) SFX.play("tick"); H.lastTickSec = s; }
  if (left <= 0) closeAnswers();
}
function closeAnswers() {
  if (H.phase !== "open") return;
  clearTimers();
  H.acceptUntil = now() + 900;
  setPhase("closing"); SFX.play("buzzer");
  later(1200, () => { H.botTimers.forEach(clearTimeout); H.botTimers = []; H.result = computeResult(); setPhase("check"); SFX.play("drum"); });
}
function computeResult() {
  const q = curQ(); const alive = aliveList();
  const rows = alive.map(p => { const a = H.answers.get(p.id); return { id: p.id, name: p.name, c: a ? a.c : null, ms: a ? a.ms : null }; });
  const counts = q.c.map((_, i) => rows.filter(r => r.c === i).length);
  const correct = rows.filter(r => r.c === q.a).sort((x, y) => x.ms - y.ms);
  const wrong = rows.filter(r => r.c != null && r.c !== q.a);
  const none = rows.filter(r => r.c == null);
  let slow = [], noCount = false, champion = null;
  if (!correct.length) noCount = true;
  else if (correct.length >= 2 && H.settings.slowOut) {
    const max = correct[correct.length - 1].ms; slow = correct.filter(r => r.ms === max);
    if (slow.length === correct.length) slow = [];
  }
  const survivors = noCount ? rows.map(r => r.id) : correct.filter(r => !slow.includes(r)).map(r => r.id);
  if (!noCount && survivors.length === 1) champion = survivors[0];
  return { counts, correct, wrong, none, slow, noCount, survivors, champion, total: rows.length };
}
function doReveal() {
  const r = H.result;
  for (const x of r.correct) { const p = H.players.get(x.id); if (p) { p.correct++; p.res = { k: "o", ms: x.ms }; } }
  for (const x of r.wrong) { const p = H.players.get(x.id); if (p) p.res = { k: "x" }; }
  for (const x of r.none) { const p = H.players.get(x.id); if (p) p.res = { k: "n" }; }
  if (r.noCount) for (const x of [...r.wrong, ...r.none]) { const p = H.players.get(x.id); if (p) p.res = { k: "z" }; }
  setPhase("reveal"); SFX.play("chime");
}
function doResult() {
  const r = H.result;
  if (!r.noCount) {
    r.correct.forEach((x, i) => {
      const p = H.players.get(x.id); if (!p) return;
      H.periodTime.set(x.id, (H.periodTime.get(x.id) || 0) + x.ms);
      const isSlow = r.slow.includes(x);
      p.res = { k: isSlow ? "s" : "o", rank: i + 1, ms: x.ms };
      if (isSlow) p.alive = false;
    });
    for (const x of [...r.wrong, ...r.none]) { const p = H.players.get(x.id); if (p) p.alive = false; }
  }
  saveSnap(); setPhase("result");
  if (!r.noCount && (r.wrong.length || r.none.length || r.slow.length)) SFX.play("out");
}
function decideByTime() {
  const alive = aliveList();
  if (!alive.length) { H.pi++; startPeriod(); return; }
  alive.sort((a, b) => (H.periodTime.get(a.id) || 0) - (H.periodTime.get(b.id) || 0));
  announceChampion(alive[0].id, alive.length > 1);
}
function announceChampion(id, byTime) {
  clearTimers();
  const p = H.players.get(id); const per = curPeriod();
  H.champ = { id, name: p ? p.name : "？", byTime };
  if (p) p.champs++;
  H.history.push({ title: per.title, name: H.champ.name });
  H.periodActive = false;
  saveSnap(); setPhase("champion"); SFX.play("fanfare"); confetti();
}
function scheduleBots() {
  const q = curQ(), qid = H.qid;
  const read = H.settings.readDelay * 1000, end = read + H.settings.limit * 1000 - 400;
  for (const p of H.players.values()) {
    if (!p.bot || !p.alive || Math.random() < 0.06) continue;
    const ms = Math.round(Math.max(600, read * 0.5 + Math.random() * Math.random() * (end - read * 0.5)));
    const c = Math.random() < 0.72 ? q.a : (q.a + 1 + Math.floor(Math.random() * (q.c.length - 1))) % q.c.length;
    H.botTimers.push(setTimeout(() => { if (H.qid === qid) handleAns({ id: p.id, q: qid, c, ms }); }, ms));
  }
}
function addBots(n) {
  const base = [...H.players.values()].filter(p => p.bot).length;
  for (let i = 1; i <= n; i++) {
    const id = "bot" + rand(8);
    H.players.set(id, { id, name: `ダミー${base + i}`, bot: true, alive: !H.periodActive, waiting: H.periodActive, correct: 0, champs: 0, res: null });
  }
  saveSnap(); renderLobbyList(); renderTop(); publishState();
}
function resetGame() {
  clearTimers();
  H.pi = 0; H.qi = -1; H.periodActive = false; H.history = []; H.champ = null; H.result = null; H.periodTime = new Map();
  for (const p of H.players.values()) { p.alive = true; p.waiting = false; p.correct = 0; p.champs = 0; p.res = null; }
  H.resumed = false; saveSnap(); setPhase("lobby");
}
function saveSnap() {
  store.set("kq-host", {
    v: 1, at: Date.now(), code: H.code, mode: H.mode, brokerIdx: H.brokerIdx,
    pi: H.pi, qi: H.qi, periodActive: H.periodActive, history: H.history, periodTime: [...H.periodTime],
    players: [...H.players.values()].map(({ id, name, bot, alive, waiting, correct, champs }) => ({ id, name, bot, alive, waiting, correct, champs })),
  });
}

/* ----- スマホに送る状態 ----- */
function publicState() {
  const per = curPeriod(), q = curQ(), ph = H.phase;
  const st = { v: 1, ph, code: H.code, pt: per ? per.title : "", pn: H.periods.length, pi: H.pi, qn: H.qi + 1, qc: per ? per.qs.length : 0,
    qid: H.qid, lim: H.settings.limit, alive: aliveList().length, total: H.players.size };
  if (q && ["read", "open", "closing", "check", "reveal", "result"].includes(ph)) {
    st.nc = q.c.length;
    if (H.settings.phoneText) { st.qt = q.t; if (ph !== "read") st.ch = q.c; }
    if (["reveal", "result"].includes(ph)) st.ans = q.a;
  }
  st.p = [...H.players.values()].filter(p => !p.bot).map(p => {
    const r = p.res || {}; return [p.id, p.name, p.alive ? 1 : 0, p.waiting ? 1 : 0, ["reveal", "result"].includes(ph) ? (r.k || "") : "", r.rank || 0, r.ms || 0];
  });
  if (ph === "champion" && H.champ) st.champ = H.champ;
  if (ph === "final") st.hist = H.history;
  return st;
}
function publishState() { if (H.link) H.link.publish(T("state"), JSON.stringify(publicState()), true); }

/* ----- 画面 ----- */
function setPhase(ph) { H.phase = ph; renderHost(); publishState(); }
function hostShell() {

function drawQR(cv, text) {
  try {
    const qr = new QRLib.QRCode(-1, QRLib.ECL.M); qr.addData(text); qr.make();
    const n = qr.getModuleCount(), quiet = 2, size = cv.width, cell = Math.floor(size / (n + quiet * 2));
    const off = Math.floor((size - cell * n) / 2); const ctx = cv.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, size, size); ctx.fillStyle = "#0A0E27";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) ctx.fillRect(off + c * cell, off + r * cell, cell, cell);
  } catch (e) { console.error(e); }
}

const P = { room: "", id: "", name: "", link: null, st: null, qid: null, qStart: 0, openAt: 0, my: null, connected: false, lastJoin: 0, gotState: false };
const PT = s => TOPIC_ROOT + P.room + "/" + s;

function startPlayer(room) {

}
function renderJoinForm() {
  app.innerHTML = `

  $("#iName").focus();
  $("#fJoin").onsubmit = e => {
    e.preventDefault(); const n = cleanName($("#iName").value);
    if (!n) { toast("ニックネームを入れてね"); return; }
    P.name = n; store.set("kq-player", { id: P.id, name: n });
    try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch (err) {}
    playerConnect();
  };
}
function playerConnect() {
  if (!P.link) {
    const { link } = linkFromParams(P.room); P.link = link;
    link.on("status", ok => { P.connected = ok; if (ok) { sendJoin(true); resendAnswer(); } renderPlayer(); });
    link.on("message", (topic, str) => { if (topic !== PT("state")) return; let st; try { st = JSON.parse(str); } catch (e) { return; } if (st && st.v === 1) onState(st); });
    link.subscribe(PT("state"));
    link.connect(0, true);
    setTimeout(() => { P.slow = true; if (!P.gotState) renderPlayer(); }, 8000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) { try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch (e) {} } });
  }
  renderPlayer();
}
function sendJoin(force) {
  if (!P.link || !P.connected) return;
  if (!force && Date.now() - P.lastJoin < 2500) return;
  P.lastJoin = Date.now(); P.link.publish(PT("join"), JSON.stringify({ id: P.id, n: P.name }));
}
function resendAnswer() {
  const st = P.st; if (!P.my || !st || P.my.qid !== st.qid || !["read", "open"].includes(st.ph)) return;
  P.link.publish(PT("ans"), JSON.stringify({ id: P.id, q: P.my.qid, c: P.my.c, ms: P.my.ms }));
}
function myRow() { const st = P.st; if (!st || !Array.isArray(st.p)) return null; const r = st.p.find(x => x[0] === P.id); return r ? { alive: !!r[2], waiting: !!r[3], k: r[4], rank: r[5], ms: r[6] } : null; }
function onState(st) {
  const prev = P.st; P.st = st; P.gotState = true;
  if (["read", "open", "closing"].includes(st.ph) && st.qid !== P.qid) { P.qid = st.qid; P.qStart = now(); P.openAt = 0; P.my = null; }
  if (st.ph === "open" && !P.openAt) P.openAt = now();
  if (!myRow()) sendJoin(false);
  if (prev && prev.ph !== st.ph && st.ph === "champion" && st.champ && st.champ.name && myRow() && st.champ.id === P.id) confetti();
  renderPlayer();
}
function press(c) {
  const st = P.st, me = myRow();
  if (!st || !me || !me.alive || !["read", "open"].includes(st.ph) || P.qid !== st.qid) return;
  const ms = Math.round(now() - P.qStart);
  P.my = { qid: st.qid, c, ms };
  P.link.publish(PT("ans"), JSON.stringify({ id: P.id, q: st.qid, c, ms }));
  try { navigator.vibrate && navigator.vibrate(25); } catch (e) {}
  renderPlayer();
}
let plTimer = null;
function renderPlayer() {
  clearInterval(plTimer);
  const st = P.st, me = myRow();
  const top = `<div class="pl-top"><span class="me">${esc(P.name)}</span><span class="right">部屋 ${esc(P.room)} <span class="dot ${P.connected ? "on" : ""}" role="img" aria-label="${P.connected ? "接続中" : "接続していません"}"></span></span></div>`;
  let status = "", pads = "";
  const box = (cls, eyebrow, main, sub, big) => `<div class="status ${cls}" aria-live="polite">${eyebrow ? `<div class="s-eyebrow">${eyebrow}</div>` : ""}<div class="s-main ${big ? "big" : ""}">${main}</div>${sub ? `<div class="s-sub">${sub}</div>` : ""}</div>`;

  if (!P.connected && !st) status = box("", "", "接続しています…", "しばらく待ってね");
  else if (!st) status = box("", "", "部屋を探しています…", P.slow ? "司会の画面が開いているか、部屋コードが合っているか確認してね" : "");
  else if (!me) status = box("", "", "エントリーしています…", "");
  else {
    const qlabel = `${esc(st.pt)}　第${st.qn}問 / ${st.qc}問`;
    const inQ = ["read", "open", "closing", "check", "reveal", "result"].includes(st.ph);
    switch (st.ph) {
      case "lobby": status = box("", "エントリー完了", `${esc(P.name)} さん`, `始まるまで待っててね（参加 ${st.total}人）`); break;
      case "period": status = box("gold", `全${st.pn}ピリオド中 ${st.pi + 1}`, `${esc(st.pt)} スタート！`, me.waiting ? "" : "まちがえたら予選落ち。一番おそい正解者も予選落ち！", true); break;
      case "champion": {
        const mine = st.champ && st.champ.id === P.id;
        status = mine ? box("gold", esc(st.pt), "あなたがチャンピオン！", "おめでとう！", true) : box("", `${esc(st.pt)} チャンピオン`, st.champ ? esc(st.champ.name) : "", "次のピリオドは全員復活！");
        break;
      }
      case "final":
        status = box("gold", "全ピリオド終了", "おつかれさま！", "") +
          `<ol class="champlist">${(st.hist || []).map(h => `<li><b>${esc(h.name)}</b><span>${esc(h.title)}</span></li>`).join("")}</ol>`;
        break;
    }
    if (inQ) {
      const nc = st.nc || 4, canPress = me.alive && ["read", "open"].includes(st.ph) && P.qid === st.qid;
      const sel = P.my && P.my.qid === st.qid ? P.my.c : null;
      let main = "", cls = "", sub = "";
      if (me.waiting) { main = "次のピリオドから参加"; sub = "いまは見て楽しんでね"; }
      else if (!me.alive && !["reveal", "result"].includes(st.ph)) { main = "予選落ち…"; sub = "次のピリオドで全員復活！"; cls = "bad"; }
      else if (st.ph === "read" || st.ph === "open") { main = sel != null ? `${sel + 1} を選択中（${sec(P.my.ms)}秒）` : (st.ph === "read" ? "問題をよく見て！" : "早く押して！"); sub = sel != null ? "押し直しOK（最後に押した時間で記録）" : ""; }
      else if (st.ph === "closing") { main = "締め切り！"; sub = sel != null ? `あなたの答え：${sel + 1}` : "時間切れ…"; }
      else if (st.ph === "check") { main = "アンサーチェック中…"; sub = sel != null ? `あなたの答え：${sel + 1}` : ""; }
      else if (st.ph === "reveal") {
        const m = { o: ["good", "正解！"], x: ["bad", "不正解…"], n: ["bad", "時間切れ…"], z: ["gold", "全員不正解でノーカウント！"] }[me.k];
        if (m) { cls = m[0]; main = m[1]; sub = `正解は ${st.ans + 1}`; } else { main = `正解は ${st.ans + 1}`; }
      } else if (st.ph === "result") {
        if (me.k === "o") { cls = "good"; main = `早押し ${me.rank}位！ 生き残り`; sub = `${sec(me.ms)}秒 ・ 残り ${st.alive}人`; }
        else if (me.k === "s") { cls = "bad"; main = "正解だけど一番おそかった…"; sub = `${sec(me.ms)}秒で予選落ち`; }
        else if (me.k === "x" || me.k === "n") { cls = "bad"; main = "予選落ち…"; sub = "次のピリオドで全員復活！"; }
        else if (me.k === "z") { cls = "gold"; main = "ノーカウント！ 生き残り"; sub = `残り ${st.alive}人`; }
        else main = `残り ${st.alive}人`;
      }
      const qt = st.qt ? `<div class="pq">${esc(st.qt)}</div>` : "";
      const bar = st.ph === "open" && canPress ? `<div class="tbar"><i id="tbar"></i></div>` : "";
      status = `<div class="status ${cls}" aria-live="polite"><div class="s-eyebrow">${qlabel}</div>${qt}<div class="s-main">${main}</div>${sub ? `<div class="s-sub">${sub}</div>` : ""}${bar}</div>`;
      const shownAns = ["reveal", "result"].includes(st.ph) ? st.ans : null;
      pads = `<div class="pads n${nc} ${sel != null ? "has-sel" : ""} ${shownAns != null ? "correct-shown" : ""}">${Array.from({ length: nc }, (_, i) => `
        <button class="pad k${i + 1} ${sel === i ? "sel" : ""} ${shownAns === i ? "ans" : ""}" data-c="${i}" ${canPress ? "" : "disabled"} aria-label="${i + 1}番${st.ch ? "：" + esc(st.ch[i]) : ""}">${i + 1}${st.ch ? `<small>${esc(st.ch[i])}</small>` : ""}</button>`).join("")}</div>`;
    }
  }
  app.innerHTML = `<div class="pl">${top}${status}${pads}</div>`;
  app.querySelectorAll(".pad").forEach(b => b.addEventListener("pointerdown", e => { e.preventDefault(); press(Number(b.dataset.c)); }));
  app.querySelectorAll(".pad").forEach(b => b.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); press(Number(b.dataset.c)); } }));
  const tb = $("#tbar");
  if (tb && P.openAt) {
    const lim = (P.st.lim || 10) * 1000;
    const upd = () => { const f = Math.max(0, 1 - (now() - P.openAt) / lim); tb.style.transform = `scaleX(${f})`; };
    upd(); plTimer = setInterval(upd, 100);
  }
}

/* 起動 */
if (ROOM.length >= 4) startPlayer(ROOM); else renderLanding();
</script>
</body>
</html>
